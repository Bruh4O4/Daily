<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index_style.css">
    <title>Daily</title>
</head>
<body>
    <header>
        <h1>Daily</h1>
        <div class="menu">
        </div>

        <hr>

        <button class="add_butt menu_butt" onclick="showAdding()">
            <img src="./img/Add.svg" alt="+">
        </button>
    </header>

    <main>
        <section id="main_h">
            <h2 class="name"></h2>
            <div id="prog">
                <h3>Прогресс по дням: </h3>
                <p class="prog_days">х из х</p>
            </div>
        </section>

        <hr>

        <section id="days_box">
        </section>
        
        <section class="cover closed">
            <div class="cover_filling">
                <button class="close" onclick="closeAdding()">
                    <img src="./img/cross.svg" alt="">
                </button>

                <h2>Новая привычка</h2>
                <hr>
                <form class="new_habbit" onsubmit="adding(event)">
                    <input 
                        type="text"
                        id="habbit_name"
                        name="habbit_name"
                        placeholder="Название"
                        required
                    >
                    <input 
                        type="number"
                        id="goal"
                        name="goal"
                        placeholder="Цель (кол-во дней)"
                        required
                    >

                    <button class="add">Добавить</button>
                </form>
            </div>
        </section>
    </main>
    <script src="./script/index_app.js"></script>
</body>
</html>
