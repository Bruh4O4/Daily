<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index_style.css">
    <title>Daily</title>
</head>
<body>
    <header>
        <h1>Daily</h1>
        <div class="menu">
        </div>

        <hr>

        <button class="add_butt menu_butt">
            <img src="./img/Add.svg" alt="+">
        </button>
    </header>

    <main>
        <section id="main_h">
            <h2>Название привычки</h2>
            <div id="prog">
                <h3>Прогресс по дням: </h3>
                <p>х из х</p>
            </div>
        </section>

        <hr>

        <section id="days_box">
            <div class="day">
                <div class="day_h">
                    <h3>День 1</h3>
                    <button class="del_butt">
                        <img src="./img/delete.svg" alt="">
                    </button>
                </div>
                <hr>
                <div class="day_comm">
                    Какой-то текст
                </div>
            </div>

            <div class="day">
                <div class="day_h">
                    <h3>День 2</h3>
                    <button class="del_butt">
                        <img src="./img/delete.svg" alt="">
                    </button>
                </div>
                <hr>
                <div class="day_comm">
                    <textarea name="comment" id="comm" placeholder="..." maxlength="250"></textarea>
                    <button id="add_day">Добавить день</button>
                </div>
            </div>
        </section>
    </main>
    <script src="./script/index_app.js"></script>
</body>
</html>
